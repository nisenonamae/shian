<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>思案</title>
<meta name="theme-color" content="#0E1224">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#0E1224;--deep:#151B33;--panel:#1B2240;--rule:#2C3560;--text:#E8E6F2;--sub:#9A9BB8;
  --seed:#8C93B8;--sprout:#7FC79A;--plan:#F2C46B;--go:#F07F5E;--link:#9DB8FF;--memo:#9DB8FF;--remind:#E58FC4;--lib:#5FC6C0;--vault:#C9A227}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--sky);color:var(--text)}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;font-size:15px;line-height:1.7;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
a{color:var(--link)}
.wrap{max-width:680px;margin:0 auto;padding:1rem 1rem 2rem}
.view[hidden]{display:none}
h1{margin:0 0 .8rem;font-size:1.3rem;letter-spacing:.2em;font-weight:700}
.capture{display:flex;gap:.4rem;margin-bottom:.4rem}
.capture input{flex:1;min-width:0;background:var(--deep);border:1px solid var(--rule);border-radius:10px;padding:.7rem .9rem;font-size:1rem}
.capture input::placeholder,textarea::placeholder,input::placeholder{color:var(--sub)}
.kinds{display:flex;gap:.3rem;margin-bottom:1rem;flex-wrap:wrap}
.kinds button,.pill{border:1px solid var(--rule);background:transparent;border-radius:20px;padding:.15rem .75rem;cursor:pointer;font-size:.84rem;color:var(--sub)}
.kinds button[aria-pressed="true"]{background:var(--plan);border-color:var(--plan);color:var(--sky);font-weight:700}
.btn{border:1px solid var(--plan);background:var(--plan);color:var(--sky);border-radius:10px;padding:.5rem 1rem;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--plan)}
.btn.sm{padding:.25rem .7rem;font-size:.84rem;border-radius:8px}
.btn.quiet{border-color:var(--rule);background:transparent;color:var(--sub);font-weight:400}
.btn.danger{border-color:var(--go);background:transparent;color:var(--go)}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:.8rem 1rem;margin:.6rem 0}
.card h2{margin:0 0 .3rem;font-size:.8rem;color:var(--sub);letter-spacing:.15em;font-weight:400;display:flex;justify-content:space-between}
.card.alert{border-color:var(--go)}
.note-row{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--rule);padding:.6rem .2rem;cursor:pointer}
.note-row:last-child{border-bottom:none}
.note-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-row .m{font-size:.74rem;color:var(--sub);white-space:nowrap}
.dot{width:.7rem;height:.7rem;border-radius:50%;flex:0 0 auto;box-shadow:0 0 8px currentColor}
.empty{color:var(--sub);font-size:.9rem;padding:.6rem 0}
.status{font-size:.84rem;color:var(--sub)}.status.err{color:var(--go)}
.back{border:none;background:none;color:var(--sub);cursor:pointer;padding:0;margin-bottom:.6rem}
.nograph-note{font-size:.76rem;color:var(--sub);margin:.3rem 0 0}.graph-hidden{font-size:.76rem;color:var(--sub);margin:-.3rem 0 .4rem}
.fdrag{touch-action:none;cursor:grab;border:none;background:transparent;color:var(--sub);font-size:1.1rem;padding:0 .3rem;line-height:1}
.fedit.dragging{opacity:.75;outline:1px dashed var(--sub);border-radius:8px}.fedit.dragging .fdrag{cursor:grabbing}
.fmove{display:inline-flex;gap:.15rem}.fmove .btn{padding:.1rem .35rem}
textarea.body{width:100%;min-height:12rem;background:var(--deep);border:1px solid var(--rule);border-radius:10px;padding:.8rem;line-height:1.8;overflow-y:hidden;resize:none}
.render{background:var(--deep);border:1px solid var(--rule);border-radius:10px;padding:.8rem 1rem;min-height:4rem;cursor:text;word-break:break-word}
.render .ttl{font-size:1.15rem;font-weight:700;display:block;margin-bottom:.3rem}
.render .h{display:block;font-weight:700;margin:.5rem 0 .1rem;color:var(--plan)}
.render .li{display:block;padding-left:1em;text-indent:-1em}
.render .cl{display:flex;gap:.45rem;align-items:flex-start}
.render .cl input{margin-top:.35rem;width:1.05rem;height:1.05rem;accent-color:var(--sprout)}
.render .cl.done span{text-decoration:line-through;color:var(--sub)}
.render .p{display:block;min-height:1em}
.wl{color:var(--link);text-decoration:underline;text-decoration-style:dotted;cursor:pointer}
.wl.missing{color:var(--sub)}
.tag{color:var(--lib);cursor:pointer}
.stages,.row-btns{display:flex;gap:.3rem;flex-wrap:wrap;margin:.6rem 0}
.stages button{border:1px solid var(--rule);background:transparent;border-radius:20px;padding:.2rem .8rem;cursor:pointer;font-size:.86rem;color:var(--sub)}
.stages button[aria-pressed="true"]{color:var(--sky);font-weight:700;background:var(--plan);border-color:var(--plan)}
.prompt{border-left:3px solid var(--plan);padding:.3rem .7rem;margin:.5rem 0;color:var(--plan);font-size:.9rem}
.f label{display:block;font-size:.76rem;color:var(--sub);margin-bottom:.15rem}
.f input,.f select,.f textarea{width:100%;background:var(--deep);border:1px solid var(--rule);border-radius:8px;padding:.45rem .6rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.5rem .7rem}
.filters{display:flex;gap:.4rem;flex-wrap:wrap;margin:.4rem 0 .6rem}
.filters input[type=search]{flex:1 1 10rem;background:var(--deep);border:1px solid var(--rule);border-radius:8px;padding:.45rem .6rem}
.filters select{background:var(--deep);border:1px solid var(--rule);border-radius:8px;padding:.4rem}
.tags{display:flex;flex-wrap:wrap;gap:.3rem;margin:.2rem 0 .6rem}
.tags button{border:1px solid var(--rule);background:transparent;border-radius:12px;padding:0 .55rem;cursor:pointer;color:var(--lib);font-size:.82rem}
.tags button[aria-pressed="true"]{background:var(--lib);color:var(--sky)}
.rem{display:flex;gap:.6rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--rule)}
.rem:last-child{border-bottom:none}
.rem .t{flex:1;min-width:0;cursor:pointer}
.rem .when{font-size:.76rem;color:var(--sub)}
.rem.over .when{color:var(--go)}
.rem .chk{width:1.6rem;height:1.6rem;border-radius:50%;border:2px solid var(--remind);background:transparent;cursor:pointer;flex:0 0 auto}
.shelves{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.5rem}
.shelf{border:1px solid var(--rule);background:var(--panel);border-radius:12px;padding:.8rem;text-align:left;cursor:pointer}
.shelf b{display:block;font-size:1rem}
.shelf span{font-size:.78rem;color:var(--sub)}
.shelf.vault{border-color:var(--vault)}
.shelf.vault b{color:var(--vault)}
.field{display:flex;gap:.5rem;align-items:center;padding:.45rem 0;border-bottom:1px solid var(--rule)}
.field .k{color:var(--sub);font-size:.82rem;min-width:5rem}
.field .v{flex:1;min-width:0;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace}
.field .v.hide{letter-spacing:.2em}
pre.code{background:#0A0E1C;border:1px solid var(--rule);border-radius:8px;padding:.7rem;overflow-x:auto;font-size:.84rem;line-height:1.5;margin:.4rem 0;white-space:pre}
.fedit{display:grid;grid-template-columns:auto 1fr 2fr auto auto;gap:.3rem;margin:.25rem 0;align-items:center}
.fedit input{background:var(--deep);border:1px solid var(--rule);border-radius:8px;padding:.35rem .5rem;min-width:0}
.key{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.15rem;letter-spacing:.08em;background:#0A0E1C;border:1px dashed var(--vault);border-radius:8px;padding:.7rem;text-align:center;word-break:break-all;color:var(--vault)}
#graph-wrap{position:relative;height:calc(100vh - 150px);min-height:360px;border:1px solid var(--rule);border-radius:12px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,#1A2148 0%,var(--sky) 70%);touch-action:none}
#graph{width:100%;height:100%;display:block}
.legend{display:flex;gap:.8rem;font-size:.76rem;color:var(--sub);margin:.4rem 0;flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:.3rem}
.qlist{list-style:none;margin:.4rem 0;padding:0}
.qlist li{display:flex;align-items:center;gap:.5rem;padding:.4rem 0;border-bottom:1px solid var(--rule)}
.qlist li:last-child{border-bottom:none}
.qlist .qt{flex:1;min-width:0}
.qlist li.off .qt{color:var(--sub);text-decoration:line-through}
.qlist .mine{font-size:.7rem;color:var(--plan);border:1px solid var(--plan);border-radius:8px;padding:0 .4rem}
.qadd{display:flex;gap:.4rem;margin-top:.5rem}
.qadd input{flex:1;background:var(--deep);border:1px solid var(--rule);border-radius:8px;padding:.45rem .6rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--deep);border-top:1px solid var(--rule);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:none;background:none;padding:.8rem 0;cursor:pointer;color:var(--sub);font-weight:700;font-size:.88rem;min-width:0}
nav.tabs button[aria-selected="true"]{color:var(--plan)}
</style>
</head>
<body>
<div class="wrap">
  <section class="view" id="view-home">
    <h1>思案</h1>
    <form class="capture" id="capture" autocomplete="off">
      <input id="cap" placeholder="思いついたこと・覚えておくこと" aria-label="書く">
      <button class="btn" type="submit">書く</button>
    </form>
    <div class="kinds" id="cap-kinds" role="group" aria-label="種類"></div>
    <span class="status" id="home-status"></span>
    <div id="home"></div>
  </section>
  <section class="view" id="view-note" hidden><div id="note"></div></section>
  <section class="view" id="view-search" hidden>
    <h1>探す</h1>
    <div class="filters">
      <input id="q" type="search" placeholder="すべてから探す">
      <select id="fk"><option value="">すべて</option><option>思案</option><option>メモ</option><option>リマインダー</option><option>書庫</option></select>
      <select id="fs"><option value="">ふつう</option><option value="pin">ピン留め</option><option value="inbox">受信箱</option><option value="sleep">寝かせ中</option><option value="archived">しまったもの</option></select>
    </div>
    <div class="tags" id="tagbar"></div>
    <div style="margin-bottom:.6rem"><button class="btn ghost sm" type="button" id="mix">掛け合わせる</button></div>
    <div id="results"></div>
  </section>
  <section class="view" id="view-lib" hidden><div id="lib"></div></section>
  <section class="view" id="view-graph" hidden>
    <h1>つながり</h1>
    <p class="graph-hidden" id="graph-hidden"></p>
    <div class="legend"><span><i class="dot" style="color:var(--seed);background:var(--seed)"></i>種</span><span><i class="dot" style="color:var(--sprout);background:var(--sprout)"></i>芽</span>
      <span><i class="dot" style="color:var(--plan);background:var(--plan)"></i>構想</span><span><i class="dot" style="color:var(--go);background:var(--go)"></i>実行へ</span>
      <span><i class="dot" style="color:var(--memo);background:var(--memo)"></i>メモ</span><span><i class="dot" style="color:var(--remind);background:var(--remind)"></i>リマインダー</span>
      <span><i class="dot" style="color:var(--lib);background:var(--lib)"></i>書庫</span>
      <span style="margin-left:auto"><button class="btn quiet sm" type="button" id="g-fit">全体を見る</button></span></div>
    <div id="graph-wrap"><canvas id="graph"></canvas></div>
  </section>
  <section class="view" id="view-settings" hidden>
    <h1>設定</h1>
    <div class="card"><h2>金庫</h2><div id="vault-settings"></div></div>
    <div class="card"><h2>問いの束</h2>
      <p style="color:var(--sub);font-size:.84rem;margin:.2rem 0">「問いかける」はこの中から選ばれます。自分の問いを足していけます。外した問いは選ばれません。</p>
      <ul class="qlist" id="qlist"></ul>
      <div class="qadd"><input id="q-new" placeholder="自分の問い"><button class="btn sm" type="button" id="q-add">足す</button></div>
      <span class="status" id="q-status"></span>
    </div>
    <div class="card"><h2>接続</h2>
      <p style="color:var(--sub);font-size:.84rem;margin:.2rem 0">非公開のリポジトリに保存します。行軍表と同じトークンが使えます。</p>
      <div class="grid2">
        <div class="f"><label for="c-owner">ユーザー名</label><input id="c-owner" autocomplete="off"></div>
        <div class="f"><label for="c-repo">リポジトリ</label><input id="c-repo" autocomplete="off"></div>
        <div class="f"><label for="c-branch">ブランチ</label><input id="c-branch" autocomplete="off"></div>
      </div>
      <div class="f" style="margin-top:.5rem"><label for="c-token">トークン</label><input id="c-token" type="password" autocomplete="off"></div>
      <div style="margin-top:.8rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">
        <button class="btn" id="connect" type="button">接続して読み込む</button>
        <button class="btn ghost" id="reload" type="button">読み込み直す</button>
        <span class="status" id="conn-status"></span>
      </div>
    </div>
    <p class="status" id="ver" style="margin-top:1rem"></p>
  </section>
</div>
<nav class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-view="home">ホーム</button>
  <button role="tab" aria-selected="false" data-view="search">探す</button>
  <button role="tab" aria-selected="false" data-view="lib">書庫</button>
  <button role="tab" aria-selected="false" data-view="graph">つながり</button>
  <button role="tab" aria-selected="false" data-view="settings">設定</button>
</nav>

<script>
(function(){
"use strict";
const APP_VERSION = "2026-10-09 r7";
const KEY_CONN = "shian-conn", KEY_CACHE = "shian-cache", KEY_KIND = "shian-kind";
const PATH = "roadmap/shian/notes.json";
const STAGES = ["種", "芽", "構想", "実行へ"];
const KINDS = ["思案", "メモ", "リマインダー"];
const STAGE_COLOR = { "種": "#8C93B8", "芽": "#7FC79A", "構想": "#F2C46B", "実行へ": "#F07F5E" };
const KIND_COLOR = { "メモ": "#9DB8FF", "リマインダー": "#E58FC4", "書庫": "#5FC6C0" };
const PROMPTS = ["逆にしたら?", "極端にしたら?(10倍、0にする)", "別の分野ならどうやる?", "何かと組み合わせたら?", "取り除いたら?",
  "誰のためのもの?", "なぜそれが要る?(3回なぜ)", "一番小さく試すなら?", "10年後から見たら?", "失敗するとしたら何が原因?"];
const DEFAULT_SHELVES = ["金庫", "コード", "手順", "番号・住所", "知識"];
const VAULT = "金庫";
const LOCK_MS = 10 * 60 * 1000;          // 金庫は開けてから10分で閉じる

const state = { conn: null, doc: { version: 2, notes: [] }, sha: null, open: null, edit: false, view: "home", backTo: "home",
  shelf: null, tag: "", vaultKey: null, unsealed: {}, revealed: {}, newKey: null };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const nowMs = () => window.__shianNow || Date.now();
const today = () => window.__shianToday || new Date(nowMs() + 4 * 3600e3).toISOString().slice(0, 10);
const nowHM = () => new Date(nowMs() + 9 * 3600e3).toISOString().slice(11, 16);
const addDays = (d, n) => new Date(Date.parse(d + "T00:00:00Z") + n * 864e5).toISOString().slice(0, 10);
const addMonths = (d, n) => { const t = new Date(Date.parse(d + "T00:00:00Z")); const day = t.getUTCDate(); t.setUTCDate(1); t.setUTCMonth(t.getUTCMonth() + n);
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate(); t.setUTCDate(Math.min(day, last)); return t.toISOString().slice(0, 10); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const rnd = n => Math.floor((window.__shianRandom ? window.__shianRandom() : Math.random()) * n);
const md = d => (+d.slice(5, 7)) + "/" + (+d.slice(8, 10));

/* ───── 思案・メモ・リマインダー・書庫の扱い ───── */
const notes = () => state.doc.notes;
const byId = id => notes().find(n => n.id === id);
const kindOf = n => n.kind || "思案";
const sealed = n => !!n.sealed;
// 金庫のものは、開けたときだけ中身が見える
const plainOf = n => sealed(n) ? (state.unsealed[n.id] || null) : n;
const textOf = n => { const p = plainOf(n); return p ? (p.text || "") : ""; };
const titleOf = n => sealed(n) && !state.unsealed[n.id] ? "(鍵がかかっています)" : (textOf(n).split("\n")[0].trim() || "(無題)");
const byTitle = t => notes().find(n => !sealed(n) && titleOf(n) === t.trim());
const WIKI = /\[\[([^\]\n]+)\]\]/g;
const TAG = /(^|[\s　])#([^\s#　,、。]+)/g;
function tagsOf(n){ const out = new Set(); let m; const s = textOf(n); TAG.lastIndex = 0; while ((m = TAG.exec(s))) out.add(m[2]); return Array.from(out); }
function linksOf(n){
  if (sealed(n)) return [];
  const out = new Set(n.links || []); let m; WIKI.lastIndex = 0;
  while ((m = WIKI.exec(n.text || ""))) { const t = byTitle(m[1]); if (t && t.id !== n.id) out.add(t.id); }
  return Array.from(out).filter(id => { const x = byId(id); return x && !sealed(x); });
}
const backlinksOf = n => sealed(n) ? [] : notes().filter(x => x.id !== n.id && linksOf(x).includes(n.id));
const degree = n => new Set(linksOf(n).concat(backlinksOf(n).map(x => x.id))).size;
const sleeping = n => n.snoozeUntil && n.snoozeUntil > today();
const live = n => !n.archived;

/* ───── リマインダー ───── */
const remOf = n => (kindOf(n) === "リマインダー" && n.remind) ? n.remind : null;
function remBuckets(){
  const d = today(), soon = addDays(d, 7), over = [], now = [], next = [];
  for (const n of notes()) { const r = remOf(n); if (!r || r.done || !live(n) || !r.date) continue;
    if (r.date < d) over.push(n); else if (r.date === d) now.push(n); else if (r.date <= soon) next.push(n); }
  const key = n => n.remind.date + " " + (n.remind.time || "99:99");
  [over, now, next].forEach(a => a.sort((x, y) => key(x) < key(y) ? -1 : 1));
  return { over, now, next };
}
function nextDate(r){
  const step = d => r.repeat === "日" ? addDays(d, 1) : r.repeat === "週" ? addDays(d, 7) : addMonths(d, 1);
  let d = step(r.date); while (d <= today()) d = step(d); return d;
}
const remWhen = r => (r.date === today() ? "今日" : r.date === addDays(today(), 1) ? "明日" : md(r.date)) + (r.time ? " " + r.time : "") + (r.repeat ? "・毎" + r.repeat : "");
function calendarUrl(n){
  const r = n.remind, dd = r.date.replace(/-/g, "");
  let dates;
  if (r.time) { const [h, mi] = r.time.split(":").map(Number); const end = new Date(Date.UTC(2000, 0, 1, h, mi + 30));
    dates = dd + "T" + r.time.replace(":", "") + "00/" + dd + "T" + String(end.getUTCHours()).padStart(2, "0") + String(end.getUTCMinutes()).padStart(2, "0") + "00"; }
  else dates = dd + "/" + addDays(r.date, 1).replace(/-/g, "");
  const rec = r.repeat ? "&recur=" + encodeURIComponent("RRULE:FREQ=" + ({ "日": "DAILY", "週": "WEEKLY", "月": "MONTHLY" })[r.repeat]) : "";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(titleOf(n)) + "&dates=" + dates +
    "&details=" + encodeURIComponent(textOf(n).split("\n").slice(1).join("\n").slice(0, 500)) + "&ctz=Asia%2FTokyo" + rec;
}

/* ───── 金庫(暗号) ─────
   中身はデータ鍵(AES-GCM)で暗号化して保存する。データ鍵は「合言葉」と「予備の鍵」それぞれから作った鍵で包んで2通り置く。
   どちらか1本あれば開く。合言葉も予備の鍵も、どこにも保存しない。 */
const te = new TextEncoder(), td = new TextDecoder();
const b64 = buf => { const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ITER = () => window.__shianIter || 210000;
async function kek(secret, salt){
  const base = await crypto.subtle.importKey("raw", te.encode(secret), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: ITER(), hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function wrapRaw(raw, secret){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const k = await kek(secret, salt);
  return { salt: b64(salt), iv: b64(iv), data: b64(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, raw)), iter: ITER() };
}
async function unwrapRaw(w, secret){
  const salt = unb64(w.salt), iv = unb64(w.iv);
  const base = await crypto.subtle.importKey("raw", te.encode(secret), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: w.iter || ITER(), hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv }, k, unb64(w.data)));
}
const dataKey = raw => crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
function newRecoveryKey(){
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", b = crypto.getRandomValues(new Uint8Array(24));
  let s = ""; for (let i = 0; i < 24; i++) { s += A[b[i] % A.length]; if (i % 4 === 3 && i < 23) s += "-"; } return s;
}
const normKey = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
async function seal(obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  return { iv: b64(iv), data: b64(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, state.vaultKey, te.encode(JSON.stringify(obj)))) };
}
async function unseal(s){ return JSON.parse(td.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(s.iv) }, state.vaultKey, unb64(s.data)))); }
async function openVault(secret, byRecovery){
  const v = state.doc.vault; if (!v) throw new Error("金庫はまだありません");
  let raw;
  try { raw = byRecovery ? await unwrapRaw(v.rec, normKey(secret)) : await unwrapRaw(v.pass, secret); }
  catch (e) { throw new Error(byRecovery ? "予備の鍵が違います" : "合言葉が違います"); }
  state.vaultKey = await dataKey(raw); state.vaultRaw = raw;
  state.unsealed = {};
  for (const n of notes()) if (sealed(n)) { try { state.unsealed[n.id] = await unseal(n.sealed); } catch (e) {} }
  clearTimeout(state.lockTimer); state.lockTimer = setTimeout(lockVault, LOCK_MS);
}
function lockVault(){ state.vaultKey = null; state.vaultRaw = null; state.unsealed = {}; state.revealed = {}; clearTimeout(state.lockTimer); render(); }
async function createVault(pass){
  const raw = crypto.getRandomValues(new Uint8Array(32)), rec = newRecoveryKey();
  const vault = { v: 1, pass: await wrapRaw(raw, pass), rec: await wrapRaw(raw, normKey(rec)), created: today() };
  state.vaultKey = await dataKey(raw); state.vaultRaw = raw;
  return { vault, rec };
}

/* ───── 本文の表示(見出し・箇条書き・チェックリスト・リンク・タグ・[[つながり]]) ───── */
function inline(s){
  let h = esc(s);
  h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/\[\[([^\]\n]+)\]\]/g, (m, t) => { const raw = t.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'");
    return '<span class="wl' + (byTitle(raw) ? "" : " missing") + '" data-wl="' + t + '">' + t + "</span>"; });
  h = h.replace(/(^|[\s　])#([^\s#　,、。<]+)/g, (m, sp, t) => sp + '<span class="tag" data-tag="' + t + '">#' + t + "</span>");
  return h;
}
function renderBody(n, editable){
  const lines = textOf(n).split("\n"), out = ['<span class="ttl">' + esc(titleOf(n)) + "</span>"];
  let inCode = false, code = [];
  lines.slice(1).forEach((ln, i) => {
    const idx = i + 1;
    if (/^```/.test(ln)) { if (inCode) { out.push('<pre class="code">' + esc(code.join("\n")) + "</pre>"); code = []; } inCode = !inCode; return; }
    if (inCode) { code.push(ln); return; }
    let m;
    if ((m = /^\s*- \[( |x|X)\] (.*)$/.exec(ln))) { const done = m[1] !== " ";
      out.push('<label class="cl' + (done ? " done" : "") + '"><input type="checkbox" data-cl="' + idx + '"' + (done ? " checked" : "") + (editable ? "" : " disabled") + "><span>" + inline(m[2]) + "</span></label>"); return; }
    if ((m = /^#{1,3} (.*)$/.exec(ln))) { out.push('<span class="h">' + inline(m[1]) + "</span>"); return; }
    if ((m = /^\s*[-・*] (.*)$/.exec(ln))) { out.push('<span class="li">・' + inline(m[1]) + "</span>"); return; }
    out.push('<span class="p">' + inline(ln) + "</span>");
  });
  if (inCode && code.length) out.push('<pre class="code">' + esc(code.join("\n")) + "</pre>");
  return out.join("");
}
/* ───── GitHub ───── */
function b64e(str){ const b = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function b64d(b64){ const bin = atob(String(b64).replace(/\s/g, "")); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }
const repo = () => "https://api.github.com/repos/" + encodeURIComponent(state.conn.owner) + "/" + encodeURIComponent(state.conn.repo);
const hdr = x => Object.assign({ "Authorization": "Bearer " + state.conn.token, "Accept": "application/vnd.github+json" }, x || {});
async function fetchRetry(url, opts){ let last; for (let i = 0; i < 3; i++) { try { return await fetch(url, opts); } catch (e) { last = e; await new Promise(r => setTimeout(r, 500 * (i + 1))); } } throw last; }
function httpErr(st, p){ const e = new Error(st === 401 ? "トークンが無効です。設定から入れ直してください。" : "GitHubとの通信に失敗しました(" + st + " " + p + ")。"); e.status = st; return e; }
async function readJson(path){
  const url = repo() + "/contents/" + path + "?ref=" + encodeURIComponent(state.conn.branch);
  const r = await fetchRetry(url, { headers: hdr(), cache: "no-store" });
  if (r.status === 404) return { data: null, sha: null };
  if (!r.ok) throw httpErr(r.status, path);
  const meta = await r.json();
  let text = meta.content ? b64d(meta.content) : null;
  if (text == null) text = await (await fetchRetry(url, { headers: hdr({ "Accept": "application/vnd.github.raw+json" }), cache: "no-store" })).text();
  return { data: JSON.parse(text), sha: meta.sha };
}
async function writeJson(path, obj, sha, msg){
  const body = { message: msg || "思案を更新", content: b64e(JSON.stringify(obj, null, 1)), branch: state.conn.branch };
  if (sha) body.sha = sha;
  const r = await fetchRetry(repo() + "/contents/" + path, { method: "PUT", headers: hdr({ "Content-Type": "application/json" }), body: JSON.stringify(body) });
  if (!r.ok) throw httpErr(r.status, path);
  return (await r.json()).content.sha;
}
function say(id, t, err){ const el = document.getElementById(id); if (el) { el.textContent = t; el.classList.toggle("err", !!err); } }
function normDoc(d){ d = (d && d.notes) ? d : { version: 2, notes: [] }; d.shelves = d.shelves && d.shelves.length ? d.shelves : DEFAULT_SHELVES.slice(); return d; }
async function load(){
  if (!state.conn || !state.conn.token) { show("settings"); return false; }
  say("conn-status", "読み込んでいます…");
  try {
    const r = await readJson(PATH);
    state.doc = normDoc(r.data); state.sha = r.sha;
    if (state.vaultKey) { for (const n of notes()) if (sealed(n)) { try { state.unsealed[n.id] = await unseal(n.sealed); } catch (e) {} } }
    lsSet(KEY_CACHE, { doc: state.doc, sha: state.sha });
    say("conn-status", "読み込みました"); render(); return true;
  } catch (e) { say("conn-status", e.message, true); say("home-status", e.message, true); return false; }
}
// 保存。別の端末で先に変わっていたら読み直して同じ操作をかけ直す
async function commit(mutate, statusId){
  mutate(state.doc); render();
  lsSet(KEY_CACHE, { doc: state.doc, sha: state.sha });
  for (let i = 0; i < 3; i++) {
    try { state.sha = await writeJson(PATH, state.doc, state.sha); lsSet(KEY_CACHE, { doc: state.doc, sha: state.sha }); return true; }
    catch (e) {
      if ((e.status === 409 || e.status === 422) && i < 2) {
        const fresh = await readJson(PATH); state.doc = normDoc(fresh.data); state.sha = fresh.sha; mutate(state.doc); render(); continue;
      }
      say(statusId || "home-status", e.message || "保存できませんでした(端末には残っています)", true); return false;
    }
  }
  return false;
}

async function sha1Id(name, date){
  const buf = await crypto.subtle.digest("SHA-1", new TextEncoder().encode(name.trim() + "|" + date));
  return "t" + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 10);
}
async function sendToTask(n){

    requirement: (n.text || "").split("\n").slice(1).join(" ").slice(0, 120), created: d, initial: { status: "新規" },
    generations: [{ gen: 1, from: d, target: null }], events: [] };

function renumberFields(){ Array.from(document.querySelectorAll("#fedit .fedit")).forEach((r, i) => { const d = r.querySelector("[data-fdel]"); if (d) d.dataset.fdel = i; }); }
(function(){
  let drag = null;
  document.addEventListener("pointerdown", e => {
    const h = e.target.closest && e.target.closest("[data-fdrag]"); if (!h) return;
    const row = h.closest(".fedit"); if (!row) return;

    if (before) { if (drag.row.nextElementSibling !== before) box.insertBefore(drag.row, before); }

/* ───── つながりの図(力で配置) ───── */
const G = (() => {
  const cv = () => document.getElementById("graph");
  let nodes = [], edges = [], raf = null, view = { x: 0, y: 0, k: 1 }, drag = null, alpha = 1, w = 0, h = 0, dpr = 1, pointers = new Map(), pinch = null;
  const pos = {};   // 位置を覚えておく(開き直しても動かない)
  function build(){
    const all = notes().filter(n => live(n) && !sealed(n)), ns = all.filter(n => !n.noGraph);
    const hid = document.getElementById("graph-hidden"), nh = all.length - ns.length;
    if (hid) hid.textContent = nh ? "つながりに出していないもの " + nh + "件" : "";
    nodes = ns.map(n => {
      const p = pos[n.id] || (pos[n.id] = { x: (rnd(1000) - 500) / 3, y: (rnd(1000) - 500) / 3, vx: 0, vy: 0 });
      return { id: n.id, n, p, r: 5 + Math.min(14, Math.sqrt(degree(n)) * 4) };
    });
    const idx = Object.fromEntries(nodes.map((x, i) => [x.id, i]));
    const seen = new Set(); edges = [];
    for (const n of ns) for (const t of linksOf(n)) { const k = [n.id, t].sort().join("|"); if (!seen.has(k) && idx[t] != null) { seen.add(k); edges.push([idx[n.id], idx[t]]); } }
  }
  function resize(){
    const c = cv(); if (!c) return;
    dpr = window.devicePixelRatio || 1; w = c.clientWidth || 600; h = c.clientHeight || 400;
    c.width = w * dpr; c.height = h * dpr;
  }
  function step(){
    const N = nodes.length;
    for (let i = 0; i < N; i++) {
      const a = nodes[i].p;
      for (let j = i + 1; j < N; j++) {
        const b = nodes[j].p; let dx = a.x - b.x, dy = a.y - b.y;
        if (Math.abs(dx) < 0.01 && Math.abs(dy) < 0.01) { dx = (i - j) * 0.5 + 0.3; dy = (j % 3) - 1 + 0.2; }   // 完全に重なったら少しずらす
        const d2 = dx * dx + dy * dy + 0.01;
        if (d2 > 90000) continue;
        const f = 900 / d2; dx *= f; dy *= f; a.vx += dx; a.vy += dy; b.vx -= dx; b.vy -= dy;
      }
      a.vx -= a.x * 0.002; a.vy -= a.y * 0.002;       // 真ん中へ
    }
    for (const [i, j] of edges) {
      const a = nodes[i].p, b = nodes[j].p, dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1, f = (d - 70) * 0.02;
      const fx = dx / d * f, fy = dy / d * f; a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
    for (const nd of nodes) {
      if (drag && drag.node === nd) { nd.p.vx = 0; nd.p.vy = 0; continue; }
      nd.p.vx *= 0.82; nd.p.vy *= 0.82;
      nd.p.x += nd.p.vx * alpha; nd.p.y += nd.p.vy * alpha;
    }
    alpha = Math.max(0.02, alpha * 0.985);
  }
  const toScreen = p => [(p.x * view.k + view.x) + w / 2, (p.y * view.k + view.y) + h / 2];
  const toWorld = (sx, sy) => [((sx - w / 2) - view.x) / view.k, ((sy - h / 2) - view.y) / view.k];
  function draw(){
    const c = cv(); if (!c) return; const g = c.getContext("2d"); if (!g || !g.setTransform) return;
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
    g.lineWidth = 1; g.strokeStyle = "rgba(157,184,255,0.28)";
    for (const [i, j] of edges) { const [x1, y1] = toScreen(nodes[i].p), [x2, y2] = toScreen(nodes[j].p); g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
    for (const nd of nodes) {
      const [x, y] = toScreen(nd.p), r = nd.r * Math.sqrt(view.k), col = dotColor(nd.n);
      g.globalAlpha = sleeping(nd.n) ? 0.35 : 1;
      g.shadowColor = col; g.shadowBlur = 12; g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); g.shadowBlur = 0;
      if (view.k > 0.7 || nd.r > 9) { g.fillStyle = "rgba(232,230,242,0.9)"; g.font = (11 + Math.min(4, nd.r / 4)) + "px 'Zen Maru Gothic',sans-serif"; g.textAlign = "center";
        const t = titleOf(nd.n); g.fillText(t.length > 14 ? t.slice(0, 14) + "…" : t, x, y + r + 13); }
      g.globalAlpha = 1;
    }
  }
  function loop(){ step(); draw(); raf = requestAnimationFrame(loop); }
  function hit(sx, sy){ let best = null, bd = 1e9; for (const nd of nodes) { const [x, y] = toScreen(nd.p), d = Math.hypot(x - sx, y - sy); if (d < Math.max(14, nd.r * Math.sqrt(view.k) + 6) && d < bd) { bd = d; best = nd; } } return best; }
  function fit(){
    if (!nodes.length) return;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const nd of nodes) { x0 = Math.min(x0, nd.p.x); y0 = Math.min(y0, nd.p.y); x1 = Math.max(x1, nd.p.x); y1 = Math.max(y1, nd.p.y); }
    const k = Math.min(2, Math.max(0.2, Math.min(w / ((x1 - x0) + 120), h / ((y1 - y0) + 120))));
    view = { k, x: -((x0 + x1) / 2) * k, y: -((y0 + y1) / 2) * k };
  }
  function bind(){
    const c = cv(); if (!c || c.__bound) return; c.__bound = true;
    const local = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    c.addEventListener("pointerdown", e => {
      c.setPointerCapture && c.setPointerCapture(e.pointerId);
      const [sx, sy] = local(e); pointers.set(e.pointerId, [sx, sy]);
      if (pointers.size === 2) { const [a, b] = Array.from(pointers.values()); pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), k: view.k }; drag = null; return; }
      const nd = hit(sx, sy);
      drag = { node: nd, sx, sy, vx: view.x, vy: view.y, moved: false }; alpha = Math.max(alpha, 0.3);
    });
    c.addEventListener("pointermove", e => {
      const [sx, sy] = local(e); if (pointers.has(e.pointerId)) pointers.set(e.pointerId, [sx, sy]);
      if (pinch && pointers.size === 2) { const [a, b] = Array.from(pointers.values()); view.k = Math.min(4, Math.max(0.15, pinch.k * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d)); return; }
      if (!drag) return;
      if (Math.hypot(sx - drag.sx, sy - drag.sy) > 4) drag.moved = true;
      if (drag.node) { const [wx, wy] = toWorld(sx, sy); drag.node.p.x = wx; drag.node.p.y = wy; alpha = Math.max(alpha, 0.3); }
      else { view.x = drag.vx + (sx - drag.sx); view.y = drag.vy + (sy - drag.sy); }
    });
    const up = e => {
      pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null;
      if (drag && !drag.moved && drag.node) openNote(drag.node.id);
      drag = null;
    };
    c.addEventListener("pointerup", up); c.addEventListener("pointercancel", up);
    c.addEventListener("wheel", e => { e.preventDefault(); const f = Math.exp(-e.deltaY * 0.0015); view.k = Math.min(4, Math.max(0.15, view.k * f)); }, { passive: false });
    window.addEventListener("resize", () => { if (raf) resize(); });
  }
  return {
    start(){ resize(); build(); bind(); alpha = 1; if (!raf) { for (let i = 0; i < 120; i++) step(); fit(); raf = requestAnimationFrame(loop); } },
    stop(){ if (raf) cancelAnimationFrame(raf); raf = null; },
    fit(){ fit(); },
    _state: () => ({ nodes, edges }), _hit: hit, _toScreen: p => toScreen(p),
  };
})();

      [2093, 2637, 3136, 2637].forEach((f, i) => note(c, f, 0.45 + i * 0.07, 0.25, { g: 0.025 })); },
    levelup: c => { note(c, 600, 0, 0.5, { f2: 1600, type: "triangle", g: 0.08 }); [1568, 1975.5, 2349.3, 3136].forEach((f, i) => bell(c, f, 0.35 + i * 0.06, 0.4, 0.04)); },
    issue: c => { [392, 523.25, 659.25, 783.99].forEach((f, i) => note(c, f, i * 0.12, i === 3 ? 0.9 : 0.22, { type: "sawtooth", g: 0.07, lp: 1800, a: 0.02 }));
      note(c, 196, 0.36, 0.9, { type: "sawtooth", g: 0.04, lp: 700, a: 0.03 }); },
    swell: c => { noise(c, 0, 0.9, { f: 200, f2: 1400, g: 0.05 }); [440, 554.4, 659.3].forEach(f => note(c, f, 0.05, 0.9, { g: 0.035, a: 0.35 })); },
    unswell: c => { noise(c, 0, 0.6, { f: 1200, f2: 250, g: 0.04 }); note(c, 554.4, 0, 0.5, { f2: 440, g: 0.04, a: 0.1 }); },
    pluck: c => { note(c, 880, 0, 0.35, { type: "triangle", g: 0.09, a: 0.002 }); note(c, 1318.5, 0.05, 0.4, { type: "triangle", g: 0.06, a: 0.002 }); },
    link: c => { note(c, 659.3, 0, 0.25, { type: "triangle", g: 0.08, a: 0.002 }); note(c, 987.8, 0.09, 0.35, { type: "triangle", g: 0.08, a: 0.002 }); },
    lock: c => { note(c, 180, 0, 0.06, { type: "square", g: 0.05, lp: 1200 }); note(c, 120, 0.05, 0.08, { type: "square", g: 0.05, lp: 900 }); },
    unlock: c => { note(c, 160, 0, 0.05, { type: "square", g: 0.05, lp: 1200 }); bell(c, 1318.5, 0.08, 0.45, 0.07); },
    send: c => noise(c, 0, 0.25, { f: 2400, f2: 400, type: "bandpass", q: 1.5, g: 0.06 }),
    down: c => { note(c, 660, 0, 0.25, { f2: 440, type: "triangle", g: 0.07 }); },
  };
  function play(name, opt){
    try {
      const c = ac(); if (!c || !lib[name]) return;
      if (name === "tap" || name === "tab") { const now = Date.now(); if (now - lastTap < 45) return; lastTap = now; }
      if (name === "error") { const now = Date.now(); if (now - lastErr < 500) return; lastErr = now; }
      lib[name](c, opt);
    } catch (e) {}
  }
  // 場面の見分け:アプリごとの [選び方, 音] の並び(上から順に見る)
  let rules = [];
  function soundFor(el){
    for (const [sel, snd] of rules) { const hit = el.closest(sel); if (hit) return typeof snd === "function" ? snd(hit) : snd; }
    const inp = el.closest("input");
    if (inp && (inp.type === "checkbox" || inp.type === "radio")) return inp.checked ? "toggleOn" : "toggleOff";
    if (el.closest("nav button, [role=tab], .tabs button")) return "tab";
    if (el.closest("button, a[href], summary, .chip-b, [data-v]")) return "tap";
    return null;
  }
  function init(appRules){
    rules = appRules || [];
    document.addEventListener("click", e => { const s = e.target && e.target.closest ? soundFor(e.target) : null; if (s) play(s); }, true);
    // エラーの表示(class="err")が出たら、低い音
    try {
      new MutationObserver(ms => { for (const m of ms) { const el = m.target.nodeType === 1 ? m.target : m.target.parentElement; if (!el || !el.closest) continue;
        const er = el.closest(".err"); if (er && (er.textContent || "").trim()) { play("error"); break; } } })
        .observe(document.body, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ["class"] });
    } catch (e) {}
  }
  // 設定の欄(入/切・音量)。アプリの版の表示のそばに置く
  function mount(anchor){
    if (!anchor || document.getElementById("se-row")) return;
    const row = document.createElement("div"); row.id = "se-row"; row.className = "se-row";
    row.innerHTML = '<span>効果音</span><button type="button" id="se-on" class="se-btn"></button><label class="se-vol">音量 <input id="se-vol" type="range" min="0" max="1" step="0.05"></label>';
    anchor.parentNode.insertBefore(row, anchor.nextSibling);
    const b = row.querySelector("#se-on"), r = row.querySelector("#se-vol");
    const show = () => { b.textContent = on ? "入" : "切"; b.setAttribute("aria-pressed", String(on)); r.value = vol; r.disabled = !on; };
    b.addEventListener("click", () => { on = !on; try { localStorage.setItem("se-on", on ? "1" : "0"); } catch (e) {} show(); if (on) play("toggleOn"); });
    r.addEventListener("input", () => { vol = +r.value; try { localStorage.setItem("se-vol", String(vol)); } catch (e) {} });
    r.addEventListener("change", () => play("done"));
    show();
  }
  return { play, init, mount, soundFor, get on(){ return on; } };
})();

SE.init([
  ['#capture button[type="submit"], [data-save]', "pluck"],
  ["[data-rem-done]", "done"],
  ["[data-link]", "link"],
  ["[data-unlock]", "unlock"], ["[data-lock]", "lock"],
  ["[data-to-task], [data-to-agenda]", "send"],
  ["[data-archive], [data-rem-later], [data-sleep], [data-rem-undo]", "down"],
  ["[data-tidy], [data-entry-new], [data-fadd], [data-shelf-add], [data-vault-create], [data-q-add], #q-add, [data-key-done], [data-rem-save]", "save"],
  ["[data-del], [data-fdel], [data-q-del]", "remove"],
  ["[data-pin], [data-wake]", "toggleOn"],
  ["[data-graph-toggle]", el => el.getAttribute("aria-pressed") === "true" ? "toggleOff" : "toggleOn"],
  ["[data-open], #connect, #reload", "open"],
  ["[data-view], nav button", "tab"]
]);
(function(){ const go = () => { const a = document.getElementById("ver"); SE.mount(a ? (a.closest("p, div, .f, .row") || a) : null); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go); else go(); })();
</script>
